name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./cmd/mexporter

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: layout fuzz
        run: go test ./internal/layout -run '^$' -fuzz '^FuzzSanitizeName$' -fuzztime 15s

      - name: session fuzz
        run: go test ./internal/session -run '^$' -fuzz '^FuzzSessionJSON$' -fuzztime 15s
